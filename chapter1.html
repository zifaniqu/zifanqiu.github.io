“你在干什么?”
</p>

<p>
风挟着清朗的男声在耳旁，
左手腕上的表指向23:17，
那是临近午夜的时刻，
我灰暗人生里第一场日出的时刻。
</p>

<p>
23:17。
</p>

<p>
我登上天台，第数次俯视这座城市。
</p>

<p>
这个地方真是烂透了，
灯红酒绿模糊住罪恶的样子，
像是怎么也刮不尽的桌底口香糖，
你只能尽力去忽视它。
</p>
