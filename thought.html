<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>思想缓行地</title>

<style>

body{
    background:#f5f5f5;
    color:#2a2a2a;
    max-width:900px;
    margin:auto;
    padding:60px 25px;
    font-family:"Noto Serif SC","Times New Roman",serif;
    line-height:1.9;
}

/* 标题 */

h1{
    text-align:center;
    color:#222222;
    font-weight:normal;
}

h2{
    text-align:center;
    color:#6d6d6d;
    font-weight:normal;
    margin-bottom:40px;
}

/* 简介 */

.intro{
    text-align:center;
    color:#666666;
    margin-bottom:50px;
}

/* 题记 */

.quote{
    text-align:center;
    color:#808080;
    font-style:italic;
    margin:40px 0;
}

/* 文章总容器 */

.card-container{
    background:#fafafa;
    border-left:6px solid #5c5c5c;
    border-radius:18px;
    padding:30px;
    margin:50px 0;
}

/* 卡片 */

.essay-card{
    padding:25px;
    margin:35px 0;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

/* 标题 */

.title{
    font-size:1.2rem;
    font-weight:bold;
    margin-bottom:12px;
}

/* 正文 */

.short{
    white-space:pre-line;
    line-height:1.8;
}

/* 链接 */

a{
    text-decoration:none;
    color:inherit;
}

/* 页脚 */

.footer{
    text-align:center;
    color:#7a7a7a;
    margin-top:70px;
}

.footer a{
    color:#666666;
}

.footer a:hover{
    color:#222222;
}

/* ===================== */
/* 黑白灰卡片配色 */
/* ===================== */

/* 墨黑 */

.ink{
    background:#2f2f2f;
    color:#f5f5f5;
}

/* 石墨灰 */

.graphite{
    background:#575757;
    color:#f5f5f5;
}

/* 深灰 */

.slate{
    background:#777777;
    color:#ffffff;
}

/* 银灰 */

.silver{
    background:#d7d7d7;
    color:#222222;
}

/* 云灰 */

.accent{
    background:#b6b6b6;
    color:#222222;
}

</style>

</head>

<body>

<h1>思想缓行地</h1>

<h2>Thoughts in Transit</h2>

<div class="intro">

关于问题、答案与未完成的思考。<br>
On questions, answers, and unfinished thoughts.

</div>

<div class="quote">

“路漫漫其修远兮，吾将上下而求索。”

</div>

<div class="card-container">

    <!-- 随笔1 -->

    <div class="essay-card ink">

        <div class="title">
            #三字经
        </div>

        <div class="short">

待补充。

        </div>

    </div>

    <!-- 随笔2 -->

    <div class="essay-card graphite">

        <div class="title">
            #女厕所
        </div>

        <div class="short">

学校女厕所第一间的粪便凝固了。
我愤怒地思考，
为什么没人在发现它的时候将其冲掉。
现在，
它糊满了整个便器。
没有人知道罪魁祸首是谁。
厕所里，
臭味将嫌恶放大一万倍。
每个人都更加冷漠，
更加事不关己。

        </div>

    </div>

    <!-- 随笔3 -->

    <div class="essay-card accent">

        <div class="title">
            #城市
        </div>

        <div class="short">

“城市从不失眠，

只是换了一批做梦的人。”

        </div>

    </div>

</div>

<div class="footer">

    <a href="index.html">
        返回首页<br>
        Back Home
    </a>

</div>

</body>

</html>
