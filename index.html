
<div class="orbit-visual" aria-hidden="true">

    <svg viewBox="0 0 600 600"
         xmlns="http://www.w3.org/2000/svg">

        <!-- 极淡的背景参考圆 -->

        <circle cx="300" cy="300" r="270"
                fill="none" stroke="#fff"
                stroke-width=".6" opacity=".08"/>

        <!-- 外层轨道 -->

        <g class="orbit-layer orbit-layer--outer">

            <ellipse cx="300" cy="300"
                     rx="245" ry="210"
                     fill="none" stroke="#e8e8e8"
                     stroke-width="1" opacity=".65"/>

            <ellipse cx="300" cy="300"
                     rx="265" ry="230"
                     fill="none" stroke="#aaa"
                     stroke-width=".8"
                     stroke-dasharray="1 8"
                     opacity=".45"/>

            <ellipse cx="300" cy="300"
                     rx="220" ry="260"
                     fill="none" stroke="#888"
                     stroke-width=".8" opacity=".3"/>

            <circle cx="300" cy="70" r="4"
                    fill="#fff"/>

            <circle cx="540" cy="300" r="5"
                    fill="#fff"/>

            <circle cx="100" cy="420" r="5"
                    fill="#080808" stroke="#fff"
                    stroke-width="1.2"/>

        </g>


        <!-- 中层反向轨道 -->

        <g class="orbit-layer orbit-layer--middle">

            <ellipse cx="300" cy="300"
                     rx="185" ry="145"
                     transform="rotate(-32 300 300)"
                     fill="none" stroke="#eee"
                     stroke-width="1.2" opacity=".75"/>

            <circle cx="300" cy="300" r="175"
                    fill="none" stroke="#aaa"
                    stroke-width=".8"
                    stroke-dasharray="2 7"
                    opacity=".45"/>

            <ellipse cx="300" cy="300"
                     rx="140" ry="195"
                     transform="rotate(20 300 300)"
                     fill="none" stroke="#aaa"
                     stroke-width=".8" opacity=".4"/>

            <circle cx="420" cy="180" r="4"
                    fill="#fff"/>

            <circle cx="155" cy="350" r="3"
                    fill="#fff"/>

            <circle cx="300" cy="125" r="5"
                    fill="#080808" stroke="#fff"
                    stroke-width="1.2"/>

        </g>


        <!-- 内层轨道 -->

        <g class="orbit-layer orbit-layer--inner">

            <circle cx="300" cy="300" r="112"
                    fill="none" stroke="#eee"
                    stroke-width="1.2" opacity=".8"/>

            <circle cx="300" cy="300" r="85"
                    fill="none" stroke="#888"
                    stroke-width=".8"
                    stroke-dasharray="2 7"
                    opacity=".6"/>

            <ellipse cx="300" cy="300"
                     rx="65" ry="125"
                     transform="rotate(-38 300 300)"
                     fill="none" stroke="#aaa"
                     stroke-width=".8" opacity=".4"/>

            <circle cx="410" cy="300" r="3.5"
                    fill="#fff"/>

            <circle cx="225" cy="225" r="4"
                    fill="#080808" stroke="#eee"
                    stroke-width="1"/>

        </g>


        <!-- 中心核心：简洁几何图形 -->

        <g fill="none" stroke="#eee">

            <circle cx="300" cy="300" r="28"
                    stroke-width="1.2" opacity=".85"/>

            <circle cx="300" cy="300" r="10"
                    stroke-width=".8" opacity=".5"/>

            <path d="M300 264 V286
                     M300 314 V336
                     M264 300 H286
                     M314 300 H336"
                  stroke-width=".8" opacity=".65"/>

            <circle cx="300" cy="300" r="2.5"
                    fill="#fff" stroke="none"/>

        </g>


        <!-- 极简技术标记 -->

        <g fill="#858583"
           font-family="Arial, sans-serif"
           font-size="9"
           letter-spacing="2">

            <text x="315" y="43">OBS / 01</text>

            <text x="405" y="555">ORBITAL ARRAY</text>

            <text x="32" y="320">FIELD</text>

        </g>

    </svg>

</div>
