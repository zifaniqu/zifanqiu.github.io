<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111214">
  <meta name="description" content="《虚空中》——一篇关于地球、孤独与存在的短篇小说。">
  <title>虚空中｜仇梓帆 · Vesper Qiu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111214;
      --text: #d2d2d0;
      --muted: #777b7d;
      --line: #303235;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
      --sans: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }

    .earth-fixed {
      position: fixed;
      top: 50%;
      right: clamp(18px, 4vw, 64px);
      transform: translateY(-50%);
      display: block;
      width: clamp(170px, 21vw, 286px);
      height: auto;
      z-index: 0;
      opacity: .82;
      pointer-events: none;
      user-select: none;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100% - 52px, 1040px);
      margin: 0 auto;
    }

    /* 与站点其他短篇页面一致的顶部导航 */
    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      font-family: var(--sans);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 1px solid #858583;
      color: #c8c8c5;
      font-family: var(--serif);
      font-size: 16px;
      letter-spacing: -.08em;
      flex: 0 0 auto;
    }

    .brand-name { color: #c8c8c5; }

    .back-link {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .13em;
      white-space: nowrap;
    }

    .back-link:hover,
    .footer-link:hover { color: #ededeb; }

    .masthead {
      position: relative;
      padding: 82px 0 52px;
      border-bottom: 1px solid var(--line);
    }

    .masthead-meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font: 10px/1.5 var(--sans);
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 58px 0 12px;
      color: #ededeb;
      font-size: clamp(54px, 9vw, 104px);
      line-height: 1.12;
      font-weight: 400;
      letter-spacing: .12em;
      text-align: center;
    }

    .title-rule {
      width: 34px;
      height: 1px;
      margin: 30px auto 0;
      background: #858b8d;
    }

    .reading {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 72px 0 100px;
    }

    .story p {
      margin: 0 0 1.55em;
      color: var(--text);
      font-size: 17px;
      line-height: 2.12;
      letter-spacing: .025em;
      text-align: justify;
      text-indent: 2em;
      overflow-wrap: break-word;
    }

    .fracture-lines {
      margin: 0 0 1.55em;
    }

    .fracture-lines p { margin: 0; }
    .fracture-lines p:nth-child(1) { margin-bottom: .35em; }
    .fracture-lines p:nth-child(2) { margin-bottom: .7em; }
    .fracture-lines p:nth-child(3) { margin-bottom: 1.1em; }
    .fracture-lines p:nth-child(4) { margin-bottom: 1.75em; }

    .siren-fixed {
      position: fixed;
      right: 26px;
      bottom: 22px;
      z-index: 100;
      margin: 0;
      padding: 0;
      color: #aeb4b4;
      font: 13px/1.6 var(--serif);
      letter-spacing: .08em;
      text-indent: 0;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .afterword {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 40px 0 70px;
      border-top: 1px solid var(--line);
    }

    .afterword h2 {
      margin: 0 0 28px;
      color: #aeb3b2;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: .28em;
      text-align: center;
    }

    .afterword p {
      margin: 0 0 1.35em;
      color: #929797;
      font-size: 14px;
      line-height: 2;
      letter-spacing: .025em;
      text-align: justify;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 24px 0 36px;
      border-top: 1px solid var(--line);
      color: #777b7d;
      font: 10px/1.7 var(--sans);
      letter-spacing: .1em;
    }

    .footer-link { color: #aeb4b4; }

    .load-error {
      padding: 30px 0;
      color: #b8a6a6;
      font: 13px/1.8 var(--sans);
      text-align: center;
    }

    @media (max-width: 1100px) {
      .earth-fixed {
        width: 150px;
        right: 10px;
        opacity: .34;
      }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 38px, 720px); }
      .topbar { min-height: 64px; gap: 12px; }
      .brand { gap: 8px; font-size: 9px; letter-spacing: .09em; }
      .brand-mark { width: 28px; height: 28px; font-size: 14px; }
      .back-link { max-width: 132px; text-align: right; font-size: 8px; letter-spacing: .08em; }

      .masthead { padding: 52px 0 38px; }
      .masthead-meta { font-size: 8px; letter-spacing: .14em; }
      h1 {
        margin-top: 48px;
        font-size: clamp(48px, 16vw, 72px);
      }

      .reading { padding: 48px 0 72px; }

      .story p {
        font-size: 16px;
        line-height: 2.02;
        letter-spacing: .01em;
        text-align: left;
      }

      .fracture-lines p { text-align: left; }

      .earth-fixed {
        width: 92px;
        right: -10px;
        top: 34%;
        opacity: .24;
      }

      .siren-fixed { right: 13px; bottom: 12px; font-size: 11px; }
      .afterword { padding: 34px 0 52px; }
      .afterword p { font-size: 13px; line-height: 1.95; }
      .site-footer { align-items: flex-start; flex-direction: column; gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body id="top">
  <img class="earth-fixed" src="earth.png" alt="" aria-hidden="true">

  <div class="page">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="返回幻想观测局首页">
        <span class="brand-mark">V.</span>
        <span class="brand-name">VESPER / FICTION ARCHIVE</span>
      </a>
      <a class="back-link" href="index.html#collections">↖ 返回作品索引</a>
    </header>

    <header class="masthead">
      <div class="masthead-meta">
        <span>VESPER QIU</span>
        <span>SHORT FICTION / NO. 007</span>
      </div>
      <h1>虚空中</h1>
      <div class="title-rule"></div>
    </header>

    <main class="reading">
      <article class="story" id="story-content" aria-label="虚空中正文"></article>

      <aside class="afterword" id="afterword-content" hidden>
        <h2>后记</h2>
      </aside>

      <div class="load-error" id="load-error" hidden>
        正文暂时无法加载。请确认仓库中存在 file/xukongzhong.txt。
      </div>
    </main>

    <footer class="site-footer">
      <span>仇梓帆 · Vesper Qiu</span>
      <a class="footer-link" href="index.html#collections">↖ 返回作品索引</a>
    </footer>
  </div>

  <script>
    const storyRoot = document.getElementById("story-content");
    const afterwordRoot = document.getElementById("afterword-content");
    const loadError = document.getElementById("load-error");

    const fractureLines = [
      "他看着蓝星。",
      "黑暗看着他。",
      "黑暗看着他！",
      "黑暗看见了他！！！"
    ];

    function addParagraph(parent, text) {
      const p = document.createElement("p");
      p.textContent = text;
      parent.appendChild(p);
    }

    fetch("./file/xukongzhong.txt")
      .then(response => {
        if (!response.ok) throw new Error("Text file not found");
        return response.text();
      })
      .then(rawText => {
        const blocks = rawText
          .replace(/^\uFEFF/, "")
          .replace(/\r\n?/g, "\n")
          .trim()
          .split(/\n\s*\n/)
          .map(block => block.trim())
          .filter(Boolean);

        let inAfterword = false;

        for (let i = 0; i < blocks.length; i++) {
          const block = blocks[i];

          if (block === "后记") {
            inAfterword = true;
            afterwordRoot.hidden = false;
            continue;
          }

          if (block === "警笛声响起。") {
            const siren = document.createElement("div");
            siren.className = "siren-fixed";
            siren.textContent = block;
            storyRoot.appendChild(siren);
            continue;
          }

          if (!inAfterword &&
              fractureLines.every((line, offset) => blocks[i + offset] === line)) {
            const group = document.createElement("div");
            group.className = "fracture-lines";
            fractureLines.forEach(line => addParagraph(group, line));
            storyRoot.appendChild(group);
            i += fractureLines.length - 1;
            continue;
          }

          addParagraph(inAfterword ? afterwordRoot : storyRoot, block);
        }
      })
      .catch(() => {
        loadError.hidden = false;
      });
  </script>
</body>
</html>
