
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="思想缓行地 — Thoughts in Transit">
    <title>思想缓行地 — VESPER / ARCHIVE</title>

    <style>
        :root {
            --bg: #ffffff;
            --text: #191918;
            --secondary: #777671;
            --line: #e7e6e2;
            --accent: #8b3939;

            --serif:
                "Noto Serif SC",
                "Songti SC",
                "STSong",
                "SimSun",
                serif;

            --sans:
                "Helvetica Neue",
                Arial,
                sans-serif;

            --gutter: clamp(22px, 6vw, 88px);
            --width: 1160px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 30px;
            background: var(--bg);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        ::selection {
            background: var(--text);
            color: var(--bg);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:focus-visible,
        summary:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 5px;
        }

        a,
        summary {
            -webkit-tap-highlight-color: transparent;
        }

        .shell {
            width: min(
                calc(100% - var(--gutter) * 2),
                var(--width)
            );
            margin-inline: auto;
        }

        /* 顶部标识 */

        .topbar {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-size: 11px;
            letter-spacing: .15em;
            white-space: nowrap;
        }

        .brand-slash {
            color: var(--accent);
            padding-inline: 4px;
        }

        .brand-archive {
            color: var(--secondary);
        }

        .back-link {
            color: var(--secondary);
            font-size: 10px;
            letter-spacing: .12em;
            transition: color .2s ease;
        }

        .back-link:hover {
            color: var(--text);
        }

        /* 标题 */

        .hero {
            display: grid;
            grid-template-columns: 76px minmax(0, 1fr);
            gap: clamp(18px, 3vw, 42px);
            padding-top: clamp(90px, 14vw, 174px);
            padding-bottom: clamp(78px, 11vw, 132px);
        }

        .page-number {
            padding-top: 13px;
            color: var(--accent);
            font-family: var(--sans);
            font-size: 12px;
            letter-spacing: .12em;
        }

        .hero-title {
            margin: 0;
            color: var(--text);
            font-family: var(--serif);
            font-size: clamp(46px, 7.2vw, 100px);
            font-weight: 400;
            letter-spacing: -.065em;
            line-height: 1.18;
        }

        .hero-en {
            margin-top: 23px;
            color: var(--secondary);
            font-size: 10px;
            letter-spacing: .23em;
            line-height: 1.8;
        }

        /* 文章索引 */

        .entries {
            border-top: 1px solid var(--line);
        }

        .entry {
            border-bottom: 1px solid var(--line);
        }

        .entry summary {
            display: grid;
            grid-template-columns: 76px minmax(0, 1fr) 24px;
            align-items: center;
            gap: clamp(18px, 3vw, 42px);
            min-height: 112px;
            padding: 24px 0;
            cursor: pointer;
            list-style: none;
        }

        .entry summary::-webkit-details-marker {
            display: none;
        }

        .entry-number {
            color: #999891;
            font-size: 11px;
            letter-spacing: .08em;
            transition: color .2s ease;
        }

        .entry-title {
            margin: 0;
            color: var(--text);
            font-family: var(--serif);
            font-size: clamp(26px, 3.1vw, 40px);
            font-weight: 400;
            letter-spacing: -.045em;
            line-height: 1.5;
            transition: color .2s ease;
        }

        .entry-mark {
            color: var(--accent);
            font-family: var(--sans);
            font-size: 19px;
            font-weight: 300;
            text-align: right;
            line-height: 1;
        }

        .entry-mark::before {
            content: "+";
        }

        .entry[open] .entry-mark::before {
            content: "−";
        }

        .entry[open] .entry-number {
            color: var(--accent);
        }

        .entry summary:hover .entry-title {
            color: #77716e;
        }

        .entry summary:hover .entry-number {
            color: var(--accent);
        }

        /* 正文 */

        .entry-content {
            display: grid;
            grid-template-columns: 76px minmax(0, 1fr) 24px;
            gap: clamp(18px, 3vw, 42px);
            padding-bottom: 52px;
            animation: reveal .3s ease both;
        }

        .body-text {
            grid-column: 2;
            max-width: 700px;
            margin: 0;
            color: #383733;
            font-family: var(--serif);
            font-size: clamp(16px, 1.35vw, 19px);
            font-weight: 400;
            line-height: 2.15;
            overflow-wrap: anywhere;
        }

        .body-text.poem {
            white-space: pre-line;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 页脚 */

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-top: 27px;
            padding-bottom: 34px;
        }

        .footer-brand {
            color: var(--secondary);
            font-size: 10px;
            letter-spacing: .13em;
        }

        .footer-back {
            color: var(--secondary);
            font-size: 10px;
            letter-spacing: .1em;
            transition: color .2s ease;
        }

        .footer-back:hover {
            color: var(--text);
        }

        /* 手机端 */

        @media (max-width: 600px) {
            :root {
                --gutter: 22px;
            }

            .topbar {
                min-height: 66px;
            }

            .brand {
                font-size: 10px;
                letter-spacing: .11em;
            }

            .back-link {
                font-size: 9px;
                letter-spacing: .06em;
            }

            .hero {
                grid-template-columns: 28px minmax(0, 1fr);
                gap: 14px;
                padding-top: 92px;
                padding-bottom: 76px;
            }

            .page-number {
                padding-top: 8px;
                font-size: 10px;
            }

            .hero-title {
                font-size: clamp(42px, 10.8vw, 62px);
                letter-spacing: -.07em;
                line-height: 1.3;
            }

            .hero-en {
                margin-top: 19px;
                font-size: 9px;
                letter-spacing: .15em;
            }

            .entry summary {
                grid-template-columns: 28px minmax(0, 1fr) 18px;
                gap: 14px;
                min-height: 88px;
                padding: 21px 0;
            }

            .entry-number {
                font-size: 10px;
            }

            .entry-title {
                font-size: 27px;
            }

            .entry-mark {
                font-size: 17px;
            }

            .entry-content {
                grid-template-columns: 28px minmax(0, 1fr);
                gap: 14px;
                padding-bottom: 37px;
            }

            .body-text {
                grid-column: 2;
                font-size: 16px;
                line-height: 2.05;
            }

            .footer {
                padding-top: 23px;
                padding-bottom: 28px;
            }

            .footer-brand,
            .footer-back {
                font-size: 9px;
                letter-spacing: .06em;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="shell">

        <header class="topbar">
            <a class="brand" href="index.html"
               aria-label="返回 Vesper Archive 首页">
                VESPER<span class="brand-slash">/</span><span class="brand-archive">ARCHIVE</span>
            </a>

            <a class="back-link" href="index.html">
                ← BACK TO INDEX
            </a>
        </header>

        <main>
            <section class="hero" aria-labelledby="page-title">
                <div class="page-number">02</div>

                <div>
                    <h1 class="hero-title" id="page-title">思想缓行地</h1>
                    <div class="hero-en">THOUGHTS IN TRANSIT</div>
                </div>
            </section>

            <section class="entries" aria-label="文章索引">

                <details class="entry">
                    <summary>
                        <span class="entry-number">01</span>
                        <h2 class="entry-title">三字经</h2>
                        <span class="entry-mark" aria-hidden="true"></span>
                    </summary>

                    <div class="entry-content">
                        <p class="body-text poem">孩子哭闹
咳嗽
红着眼背诵
在文字中溺死
炸裂
嘶吼
破开和平的夜
互相折磨
谅解
再是新一场轮回</p>
                    </div>
                </details>

                <details class="entry">
                    <summary>
                        <span class="entry-number">02</span>
                        <h2 class="entry-title">冷漠</h2>
                        <span class="entry-mark" aria-hidden="true"></span>
                    </summary>

                    <div class="entry-content">
                        <p class="body-text">学校女厕所第一间的粪便凝固了。人们愤怒地询问，为什么没人在发现它的时候将其冲掉。现在，它糊满了整个便器。没有人知道罪魁祸首是谁。厕所里，臭味将嫌恶放大一万倍。每个人都更加冷漠，更加事不关己。</p>
                    </div>
                </details>

                <details class="entry">
                    <summary>
                        <span class="entry-number">03</span>
                        <h2 class="entry-title">城市</h2>
                        <span class="entry-mark" aria-hidden="true"></span>
                    </summary>

                    <div class="entry-content">
                        <p class="body-text poem">城市从不失眠，
只是换了一批做梦的人。</p>
                    </div>
                </details>

            </section>
        </main>

        <footer class="footer">
            <span class="footer-brand">VESPER / ARCHIVE</span>

            <a class="footer-back" href="index.html">
                ← RETURN TO ARCHIVE
            </a>
        </footer>

    </div>

    <script>
        // 同一时间只展开一篇文章。
        const entries = document.querySelectorAll(".entry");

        entries.forEach((entry) => {
            entry.addEventListener("toggle", () => {
                if (!entry.open) return;

                entries.forEach((other) => {
                    if (other !== entry && other.open) {
                        other.open = false;
                    }
                });
            });
        });
    </script>
</body>
</html>
